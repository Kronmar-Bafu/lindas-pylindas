[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pylindas"
version = "0.6.6"
description = "Utilities for working with the linked data service LINDAS of the Swiss Federal Administration. Includes modules for working with cubes."
readme = "README.md"
authors = [{ name = "Marco Kronenberg", email="marco.kronenberg@bafu.admin.ch" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
keywords = ["linked data", "LINDAS", "cubes", "RDF"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "pyshacl>=0.26.0",
    "pystardog>=0.17.0",
    "PyYAML>=6.0.2",
    "rdflib>=7.0.0",  # verified graph-isomorphic through 7.1.4 for all example cubes (mock/biotope/airport, timestamps excluded); lower bound retained, newer rdflib OK
    "requests>=2.32.3",
    "sparql-dataframe>=0.4",
    "SPARQLWrapper>=2.0.0",
    "jsonschema>=4.0.0",
    "shapely>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Kronmar-Bafu/lindas-pylindas"  

[project.scripts]
pycube = "pylindas.cli:main"

[tool.bumpver]
current_version = "0.6.6"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
pre_commit_hook = ""
post_commit_hook = ""

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']
"pylindas/__init__.py" = ["{version}"]

[tool.ruff.lint]
select = ["F"]
